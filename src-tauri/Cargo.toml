[package]
name = "sterm"
version = "0.2.1"
description = "sTerm - a lightweight local terminal for Windows"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/suncodes/sTerm"
homepage = "https://github.com/suncodes/sTerm"
keywords = ["terminal", "windows", "tauri", "ai-agent"]
categories = ["command-line-interface"]

[lib]
name = "sterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8.1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
