[package]
name = "sterm"
version = "0.2.7"
description = "sTerm - a lightweight local terminal for Windows"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/suncodes/sTerm"
homepage = "https://github.com/suncodes/sTerm"
keywords = ["terminal", "windows", "tauri", "ai-agent"]
categories = ["command-line-interface"]

[lib]
name = "sterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8.1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["net", "sync", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", features = ["sink"] }
prost = "0.14"
time = "0.3"
sha2 = "0.10"
ring = "0.17"
zip = { version = "2", default-features = false, features = ["deflate"] }
if-addrs = "0.13"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[profile.release]
opt-level = "s"
lto = true
strip = true

[profile.agent-test]
inherits = "dev"
