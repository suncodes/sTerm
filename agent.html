<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="referrer" content="no-referrer">
  <title>sTerm · Agent</title>
</head>
<body>
<div id="agent-app" class="web-app">
  <svg class="icon-library" aria-hidden="true"><defs>
    <symbol id="i-terminal" viewBox="0 0 24 24"><path d="m5 6 5 6-5 6m8 0h6"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M3 6h.1M3 12h.1M3 18h.1"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M9 3H3v6m12-6h6v6M3 15v6h6m12-6v6h-6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/></symbol>
    <symbol id="i-code" viewBox="0 0 24 24"><path d="m8 7-5 5 5 5m8-10 5 5-5 5m-3-14-2 18"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H5v18h14V8Zm0 0v5h5M8 13h8m-8 4h6"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="1"/><path d="M16 8V3H3v13h5"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 10a8 8 0 1 0-.6 6M20 4v6h-6"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="m9 3-.7 2.4-2.5 1L3.6 6l-2 3.5 1.9 1.9v1.2l-1.9 1.9 2 3.5 2.2-.4 2.5 1L9 21h4l.7-2.4 2.5-1 2.2.4 2-3.5-1.9-1.9v-1.2l1.9-1.9-2-3.5-2.2.4-2.5-1L13 3Z"/><circle cx="11" cy="12" r="3"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 19V5h7l2 3h9v11Z"/></symbol>
    <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="13" rx="1.5"/><path d="M12 16v5m-5 0h10"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="m12 3 10 18H2ZM12 9v5m0 3v.1"/></symbol>
    <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M3 8a15 15 0 0 1 18 0M6 12a10 10 0 0 1 12 0m-9 4a5 5 0 0 1 6 0m-3 4h.1"/></symbol>
  </defs></svg>
  <header class="client-header">
    <div class="client-brand"><svg class="icon brand-icon"><use href="#i-terminal"/></svg><span><strong>sTerm</strong><small>远程连接 · 工作电脑</small></span></div>
    <div class="header-actions"><nav class="mode-switch" aria-label="显示方式"><a href="/remote.html">终端</a><a href="/agent.html" aria-current="page">Agent</a></nav><span id="agent-connection" class="connection" role="status">正在连接…</span><button data-open="more" class="touch-button" aria-label="更多会话操作" aria-haspopup="dialog"><svg class="icon"><use href="#i-more"/></svg></button></div>
  </header>
  <section id="login-panel" class="login-panel" aria-labelledby="login-title"><div class="login-card"><h1 id="login-title">连接你的 sTerm</h1><p id="login-message" role="status">正在检查访问授权…</p><form id="login-form" hidden><label for="login-password">访问码</label><div class="login-password-field"><input id="login-password" type="password" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="current-password" required><button id="login-show" type="button" aria-pressed="false">显示</button></div><button id="login-submit" type="submit">进入</button></form><button id="login-retry" hidden>重新连接</button></div></section>
  <main id="agent-layout" hidden>
    <div class="session-bar"><div class="current-session"><span id="current-dot" class="status-dot"></span><strong id="agent-title">等待分享会话</strong><span id="agent-state" class="state-label" role="status"></span></div><div id="agent-sessions" class="session-tabs" role="tablist" aria-label="共享 Agent 会话"></div><button data-open="sessions" class="touch-button session-list-button" aria-label="切换会话" aria-haspopup="dialog"><svg class="icon"><use href="#i-list"/></svg><span class="wide-only">会话</span><span id="session-count" class="session-count">0</span></button></div>
    <div class="session-meta"><span id="agent-path"></span><span id="share-access"></span></div>
    <section id="agent-settings" class="agent-settings" aria-label="Agent 设置">
      <button data-open="models" id="model-button" class="setting-button" aria-haspopup="dialog" disabled><span class="setting-caption">模型</span><span id="current-model">—</span><svg class="icon"><use href="#i-down"/></svg></button>
      <span class="setting-divider"></span><button data-open="policy" id="policy-button" class="setting-button" aria-haspopup="dialog" disabled><svg class="icon"><use href="#i-lock"/></svg><span id="agent-policy">权限由 Agent 管理</span><svg class="icon"><use href="#i-down"/></svg></button>
      <span id="settings-current-state" class="settings-current-state"></span>
    </section>
    <select id="agent-model" aria-label="当前模型" hidden disabled></select>
    <div id="connection-banner" class="connection-banner" hidden><svg class="icon"><use href="#i-wifi"/></svg><span>连接已断开，草稿已保留；恢复后不会自动重发。</span><button data-reconnect>重连</button></div>
    <div id="agent-notice" class="operation-error" role="status" hidden><svg class="icon"><use href="#i-alert"/></svg><span id="notice-text"></span><button id="dismiss-notice" class="touch-button" aria-label="关闭提示"><svg class="icon"><use href="#i-close"/></svg></button></div>
    <section id="conversation" class="conversation" aria-label="Agent 会话内容"><div id="agent-messages" class="messages" role="log" aria-live="off"></div><div id="agent-empty" class="empty-conversation" hidden><svg class="icon"><use href="#i-monitor"/></svg><h2>还没有共享的 Agent 会话</h2><p>在电脑端 sTerm 终端中使用已启用接入的 Claude 或 Codex，会话会自动显示在这里。</p><small>可访问的会话由电脑端分享设置决定</small></div></section>
    <section id="interaction-dock" class="approval-dock" aria-label="待处理交互" hidden></section>
    <section id="interaction-card" class="interaction-card" aria-label="当前待处理交互" hidden></section>
    <section id="blocked-card" class="interaction-card blocked-card" aria-label="安全阻断处理" hidden></section>
    <div id="task-bar" class="queue-bar" hidden><span id="task-text"></span><button data-open="tasks">查看任务</button></div>
    <div id="native-notice" class="native-notice" hidden><span id="native-notice-text"></span><button data-open="notices">记录</button><button id="dismiss-native-notice" class="touch-button" aria-label="关闭运行提示">×</button></div>
    <div id="agent-activity-detail" class="activity-detail" role="status" hidden></div>
    <section id="agent-approvals" class="approval-dock" aria-label="工具审批" hidden></section>
    <div id="activity-bar" class="activity-bar"><span id="activity-dot" class="status-dot"></span><span id="activity-text">等待会话</span><span id="usage-summary" class="usage-summary" hidden></span><button id="agent-stop" class="stop-button" disabled hidden><svg class="icon"><use href="#i-stop"/></svg>停止生成</button></div>
    <div id="queue-bar" class="queue-bar" hidden><span><svg class="icon"><use href="#i-check"/></svg><span id="queue-text"></span></span><button data-open="queue">查看</button></div>
    <section id="composer" class="composer"><form id="agent-composer"><div class="draft-field"><label class="sr-only" for="agent-draft">发送给当前 Agent</label><textarea id="agent-draft" rows="2" placeholder="继续这个会话…" spellcheck="false" disabled></textarea><div class="draft-footer"><span id="agent-input-hint">电脑端与网页均可操作</span><span class="key-hint">Ctrl + Enter</span></div></div><button id="queue-add" type="button" class="subtle-button" hidden>加入队列</button><button id="agent-send" type="submit" class="send-button" disabled>发送</button></form></section>
    <div id="composer-unavailable" class="composer-unavailable" hidden></div>
  </main>
  <div id="toast" class="toast" role="status" hidden></div>
  <div id="sheet-layer" class="sheet-layer" hidden><div class="sheet-scrim"></div><section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1"></section></div>
</div>
<script type="module" src="/src/agent/client.ts"></script>
</body>
</html>
