<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sTerm Agent 状态</title>
  </head>
  <body>
    <section class="panel" aria-label="Agent 会话状态">
      <header id="drag-handle">
        <span class="brand">sTerm <span>Agent</span></span>
        <span id="session-count" aria-label="会话数量">0</span>
        <button id="close-overlay" type="button" aria-label="关闭悬浮窗" title="关闭悬浮窗（会话继续运行）">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </header>
      <div id="session-list" aria-label="Agent 会话列表"></div>
      <div id="overlay-error" role="status" hidden></div>
    </section>
    <script type="module" src="/src/overlay/main.ts"></script>
  </body>
</html>
